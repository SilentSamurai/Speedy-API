# SQLite is embedded, so this profile needs no external server. The database lives in memory and is
# shared between connections by name, which it only stays alive for while a connection is open — hence
# the pool that never drops to zero.
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:file:speedy-test?mode=memory&cache=shared&busy_timeout=10000&date_class=text
spring.datasource.username=
spring.datasource.password=
spring.datasource.hikari.auto-commit=true
# The shared in-memory database only lives while a connection is held, so the pool never empties.
spring.datasource.hikari.minimum-idle=1
# date_class=text (in the URL, where the driver reads it) stores java.sql temporal values as
# ISO-like text rather than the default epoch-millis INTEGERs, so Hibernate's rows are readable
# by the text codecs SqliteDialect declares.
