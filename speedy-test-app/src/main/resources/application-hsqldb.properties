# HSQLDB is embedded, so this profile needs no external server. Hibernate creates the schema with
# unquoted DDL, which HSQLDB stores upper-cased — the identifier form issue #148 was about.
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.datasource.hikari.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.datasource.url=jdbc:hsqldb:mem:bootapp
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.auto-commit=true
